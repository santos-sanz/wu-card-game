[project]
name = "wu-card-game"
version = "0.1.0"
description = "Decision-model vs text-model race on a Countdown-style card game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.scripts]
wu = "wu.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
